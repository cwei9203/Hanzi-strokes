<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<title>拆字</title>
<style>
  :root{
    --bg:#f6f2ea; --card:#fffdf8; --ink:#241f19; --pale:#cdc4b1;
    --seal:#b5382c; --line:#e3dbcb; --dim:#93897a; --ok:#3f7d52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.6 "Songti SC","STSong","Source Han Serif SC",serif;
    display:flex;justify-content:center;
  }
  main{
    width:100%;max-width:26rem;height:100dvh;display:flex;flex-direction:column;gap:.6rem;
    padding:calc(env(safe-area-inset-top) + .7rem) 1rem calc(env(safe-area-inset-bottom) + .7rem);
  }
  header{display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);letter-spacing:.06em}
  header b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}

  /* ── 字盘 ── */
  #board{flex:1;min-height:0;display:grid;place-items:center;touch-action:manipulation}
  #board svg{width:100%;height:100%;display:block;cursor:pointer}
  .grid{fill:none;stroke:#e4dccd;stroke-width:2;stroke-dasharray:12 16}
  .st{
    fill:var(--pale);pointer-events:none;
    stroke:rgba(0,0,0,0);stroke-width:28;stroke-linejoin:round;
    transition:fill .13s ease;
  }
  .st.on{fill:var(--seal)}
  .st:focus-visible{stroke:rgba(181,56,44,.3);outline:none}
  .st.flash{animation:fl .45s ease 3}
  @keyframes fl{50%{fill:var(--seal)}}
  #board.shake{animation:sk .28s ease}
  @keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* ── 状态行 ── */
  #pick{text-align:center;font-size:.8rem;color:var(--dim);min-height:1.2rem;letter-spacing:.04em}

  /* ── 槽位 ── */
  #slots{display:flex;flex-direction:column;gap:.4rem;align-items:center}
  #slots .row{display:flex;gap:.4rem}
  .chip{
    min-width:2.25rem;height:2.25rem;padding:0 .5rem;border-radius:.4rem;
    display:grid;place-items:center;font-size:1.05rem;line-height:1;
    border:1px solid var(--line);background:var(--card);color:#c8bfae;
  }
  .chip.got{color:var(--ink);border-color:#cdc3b0}
  .chip.hinted{color:#a89e8c;border-style:dashed}
  .chip.pop{animation:pop .26s ease}
  @keyframes pop{40%{transform:scale(1.18)}}

  /* ── 按钮 ── */
  .actions{display:flex;gap:.45rem}
  button{
    font:inherit;font-size:.9rem;border-radius:.6rem;border:1px solid var(--line);
    background:var(--card);color:var(--ink);padding:.7rem .8rem;cursor:pointer;
    transition:opacity .15s;
  }
  button:disabled{opacity:.4;cursor:default}
  #go{flex:1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
  #go:disabled{background:var(--pale);border-color:var(--pale);color:#fbf8f2;opacity:1}
  #msg{text-align:center;font-size:.85rem;min-height:1.3rem;color:var(--dim)}
  #msg.bad{color:var(--seal)} #msg.ok{color:var(--ok)}

  details{font-size:.78rem;color:var(--dim);border-top:1px solid var(--line);padding-top:.6rem}
  details summary{cursor:pointer;outline:none}
  details ol{margin:.5rem 0 0;padding-left:1.1rem}

  /* ── 结算 ── */
  #panel{position:fixed;inset:0;background:rgba(246,242,234,.94);backdrop-filter:blur(8px);
         display:grid;place-items:center;padding:2rem}
  #panel[hidden]{display:none}
  #panel .card{max-width:20rem;display:flex;flex-direction:column;gap:1rem;text-align:center}
  #panel h2{font-size:1.4rem;font-weight:400;margin:0}
  #panel .stats{font-size:.85rem;color:var(--dim);line-height:1.9}
  #panel button{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:.85rem}
</style>
</head>
<body>
<main>
  <header>
    <div>第 <b id="lvNo">1</b> / <b id="lvAll">30</b> 关</div>
    <div>剩 <b id="remain">0</b>　分 <b id="score">0</b></div>
  </header>

  <div id="board"></div>
  <div id="pick">点笔画，拼出一个字</div>
  <div id="slots"></div>
  <div id="msg" role="status" aria-live="polite"></div>

  <div class="actions">
    <button id="go" disabled>落笔</button>
    <button id="clr" disabled>清除</button>
    <button id="hintBtn">提示 3</button>
  </div>

  <details>
    <summary>规则</summary>
    <ol>
      <li>点选原字里的笔画，拼成另一个字。</li>
      <li>笔画是整根的，不能截断、不能变形，可以跨过别的笔画。</li>
      <li>笔画类型必须一致：竖不能当竖钩，捺不能当点。</li>
      <li>比例松一点：横长短、竖高矮随字体变，不算错；但笔画之间谁穿过谁、谁出头，必须对。</li>
      <li>同一个笔画组合有几个名字就算几个（人/八）。</li>
      <li>每找到一个字 2 分；提示给出的不计分。</li>
    </ol>
  </details>
</main>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle"><div class="card">
  <h2 id="pTitle"></h2>
  <div class="stats" id="pStats"></div>
  <button id="pBtn"></button>
</div></div>

/* ── 自检 ── */
/* 笔画类型的比较用"族"：折笔第一段是竖还是撇，是倾向而不是笔画本身，
   同一个字换个字体会跳（去 的撇折被读成竖折，云的同一笔被读成撇折）。
   竖/竖钩、捎/点不合并——那两个是真正的笔画差别。 */
const FAMILY = { 竖折: "折右", 撇折: "折右" };
const fam = ts => ts.map(t => FAMILY[t] || t).sort().join(",");

(function validate(){
  const errs = [];
  LEVELS.forEach(lv => {
    const n = GLYPHS[lv.char]?.length;
    if (!n) { errs.push(`${lv.char}: 缺少笔画数据`); return; }
    const keys = new Set();
    lv.answers.forEach(a => {
      if (!a.n.length) errs.push(`${lv.char}: 空答案`);
      if (!a.sets.length) errs.push(`${lv.char}/${a.n[0]}: 没有 sets`);
      if (a.n.some(n => !/^[\u4e00-\u9fff]$/.test(n))) errs.push(`${lv.char}: 答案不是单个汉字 ${a.n.join("/")}`);
      // 笔画类型必须逐笔吻合：竖不能当竖钩，捺不能当点
      const types = lv.ty.split(",");
      const want = fam(a.ty.split(","));
      if (types.length !== n) errs.push(`${lv.char}: ty 写了 ${types.length} 笔，笔画数据有 ${n} 笔`);
      a.sets.forEach(s => {
        if (!s.length) errs.push(`${lv.char}/${a.n[0]}: 空 sets`);
        s.forEach(i => { if (!(i >= 0 && i < n)) errs.push(`${lv.char}/${a.n[0]}: 笔画序号越界 ${i}（共 ${n} 笔）`); });
        if (new Set(s).size !== s.length) errs.push(`${lv.char}/${a.n[0]}: sets 内重复笔画`);
        const got = fam(s.map(i => types[i]));
        if (got !== want) errs.push(`${lv.char}/${a.n[0]}: 笔画类型不符，选出的是「${got}」，${a.n[0]} 是「${want}」`);
        const k = [...s].sort((x,y)=>x-y).join(",");
        if (s.length === n) errs.push(`${lv.char}/${a.n[0]}: 不能是原字本身`);
        if (keys.has(k)) errs.push(`${lv.char}: 笔画组合重复 ${k}`);
        keys.add(k);
      });
    });
  });
  if (errs.length) throw new Error("关卡数据有误：\n" + errs.join("\n"));
})();

/* 米字格跟着墨迹走：所有字的笔迹合起来量一次，四周留 24 单位呼吸位。
   写死坐标的话，木的竖尾会伸出格子，还被 viewBox 裁掉一截。 */
let FRAME;
function frame() {
  if (FRAME) return FRAME;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("style", "position:absolute;left:-9999px;width:10px;height:10px");
  const g = document.createElementNS(NS, "g");
  Object.values(GLYPHS).flat().forEach(d => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    g.append(p);
  });
  svg.append(g); document.body.append(svg);
  const b = g.getBBox();                       // 数据坐标，Y 朝上
  svg.remove();
  const s = Math.max(b.width, b.height) + 48;
  const cx = b.x + b.width / 2;
  const cy = 900 - (b.y + b.height / 2);       // 翻到屏幕坐标
  FRAME = { x: cx - s / 2, y: cy - s / 2, s, cx, cy };
  return FRAME;
}

function buildBoard() {
  const f = frame(), paths = GLYPHS[lv.data.char];
  el.board.innerHTML = `
    <svg viewBox="${f.x} ${f.y} ${f.s} ${f.s}" aria-label="${lv.data.char}">
      <rect class="grid" x="${f.x}" y="${f.y}" width="${f.s}" height="${f.s}" rx="18"/>
      <line class="grid" x1="${f.cx}" y1="${f.y}" x2="${f.cx}" y2="${f.y + f.s}"/>
      <line class="grid" x1="${f.x}" y1="${f.cy}" x2="${f.x + f.s}" y2="${f.cy}"/>
      <g transform="translate(0, 900) scale(1, -1)">
        ${paths.map((d, i) => `<path class="st" data-i="${i}" tabindex="0" role="button"
          aria-pressed="false" aria-label="第 ${i + 1} 笔" d="${d}"/>`).join("")}
      </g>
    </svg>`;
  // 交叉处上层笔画会抢点击（DESIGN 风险 2）。所以不认 DOM 顺序，
  // 只认"离哪根笔画的中心线最近"——点横竖交界也能选到自己想要的那根。
  const svg = el.board.querySelector("svg"), g = svg.querySelector("g");
  svg.addEventListener("click", e => {
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(g.getScreenCTM().inverse());
    let best = -1, bestD = 60;               // 60 单位内才算点中（笔画半宽约 20）
    svg.querySelectorAll(".st").forEach(path => {
      const L = path.getTotalLength();
      for (let k = 0; k <= 20; k++) {
        const t = path.getPointAtLength(L * k / 20);
        const d = Math.hypot(t.x - q.x, t.y - q.y);
        if (d < bestD) { bestD = d; best = +path.dataset.i; }
      }
    });
    if (best >= 0) toggle(best);
  });
  el.board.querySelectorAll(".st").forEach(p =>
    p.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault(); toggle(+p.dataset.i);
    }));
}

function paint() {
  const on = new Set(sel);
  el.board.querySelectorAll(".st").forEach(p => {
    p.classList.toggle("on", on.has(+p.dataset.i));
    p.setAttribute("aria-pressed", on.has(+p.dataset.i));
  });
  el.go.disabled = sel.length === 0;
  el.clr.disabled = sel.length === 0;
  el.pick.textContent = sel.length ? `已选 ${sel.length} 笔` : "点笔画，拼出一个字";
}

function toggle(i) {
  sel = sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i];
  paint();
  flash("");
}

function render() {
  el.lvNo.textContent = lv.index + 1;
  el.lvAll.textContent = LEVELS.length;
  el.remain.textContent = lv.data.answers.length - found.length;
  el.score.textContent = store.score + lvScore;
  el.hintBtn.textContent = `提示 ${lv.hints}`;
  el.hintBtn.disabled = lv.hints === 0 || found.length === lv.data.answers.length;

  el.slots.innerHTML = "";
  const cells = lv.data.answers.map(a => {
    const hit = found.find(f => f.answer === a);
    return { a, hit, cls: (hit ? " got" : "") + (hit?.hinted ? " hinted" : "") };
  });
  // 均分成行，避免最后一行只剩一个孤零零的格子
  const n = cells.length;
  const perRow = Math.ceil(n / Math.ceil(n / 6));
  for (let i = 0; i < n; i += perRow) {
    const row = document.createElement("div");
    row.className = "row";
    cells.slice(i, i + perRow).forEach(({ a, hit, cls }) => {
      const d = document.createElement("div");
      d.className = "chip" + cls;
      d.textContent = hit ? a.n[0] : "·";
      if (hit) d.title = a.n.join(" / ");
      row.append(d);
    });
    el.slots.append(row);
  }
}

function loadLevel(index) {
  const data = LEVELS[index];
  lv = { index, data, hints: 3 };
  sel = []; found = []; lvScore = 0;
  lookup = new Map();
  data.answers.forEach(a => a.sets.forEach(s => lookup.set([...s].sort((x,y)=>x-y).join(","), a)));
  buildBoard(); render(); paint(); flash("");
  el.panel.hidden = true;
}

function commit() {
  if (!sel.length) return;
  const key = [...sel].sort((x, y) => x - y).join(",");
  const answer = lookup.get(key);

  if (!answer) {
    el.board.classList.add("shake");
    setTimeout(() => el.board.classList.remove("shake"), 300);
    flash(sel.length === GLYPHS[lv.data.char].length ? "就是原字本身" : "这个组合不成字", "bad");
    return;
  }
  const already = found.find(f => f.answer === answer);
  if (already) { flash(`「${already.answer.n[0]}」已经找到了`, "bad"); return; }

  found.push({ answer, hinted: false });
  lvScore += 2;
  flash(`对：${answer.n.join(" / ")}`, "ok");
  sel = [];
  render(); paint();

  const chip = el.slots.querySelectorAll(".chip")[lv.data.answers.indexOf(answer)];
  if (chip) { chip.classList.add("pop"); setTimeout(() => chip.classList.remove("pop"), 280); }

  if (found.length === lv.data.answers.length) setTimeout(finish, 460);
}

function useHint() {
  if (!lv.hints) return;
  const left = lv.data.answers.filter(a => !found.some(f => f.answer === a));
  if (!left.length) return;
  const pick = left.find(a => a.sets.some(s => s.length === 2)) || left[0];
  const set = pick.sets[0];

  lv.hints--;
  found.push({ answer: pick, hinted: true });
  // 把对应笔画亮一下，让人看见是哪些
  sel = [...set]; paint();
  el.board.querySelectorAll(".st").forEach(p => {
    if (set.includes(+p.dataset.i)) { p.classList.add("flash"); setTimeout(() => p.classList.remove("flash"), 1400); }
  });
  flash(`提示：这几笔是「${pick.n[0]}」（不计分）`);
  render();
  // 玩家要是已经动了选择，别把人家的选择清掉
  setTimeout(() => { if (sel.join() === set.join()) { sel = []; paint(); } }, 1500);
  if (found.length === lv.data.answers.length) setTimeout(finish, 1700);
}

function finish() {
  const gained = lvScore;
  if (!store.cleared.includes(lv.data.char)) store.cleared.push(lv.data.char);
  store.score += gained;
  lvScore = 0;
  save(store);
  render();

  const hinted = found.filter(f => f.hinted).map(f => f.answer.n[0]);
  const next = LEVELS.findIndex(l => !store.cleared.includes(l.char));

  el.pTitle.textContent = `${lv.data.char} · 通关`;
  el.pStats.innerHTML =
    `本关 <b>${gained}</b> 分　累计 <b>${store.score}</b> 分<br>` +
    `找齐 ${found.length} / ${lv.data.answers.length}　提示 ${hinted.length} 次` +
    (hinted.length ? `<br>提示给出的：${hinted.join(" ")}` : "");
  el.pBtn.textContent = next === -1 ? "全部通关，从头再来" : "下一关";
  el.pBtn.onclick = () => {
    el.panel.hidden = true;
    if (next === -1) { store.cleared = []; store.score = 0; save(store); loadLevel(0); }
    else loadLevel(next);
  };
  el.panel.hidden = false;
  el.pBtn.focus();
}

el.go.addEventListener("click", commit);
el.clr.addEventListener("click", () => { sel = []; paint(); flash(""); });
el.hintBtn.addEventListener("click", useHint);

const start = LEVELS.findIndex(l => !store.cleared.includes(l.char));
loadLevel(start === -1 ? 0 : start);
</script>
</body>
</html>
